name: Deploy

# Déploie main sur le VPS une fois la CI verte. Désactivé tant que la variable de dépôt
# DEPLOY_ENABLED ne vaut pas "true" (Settings → Secrets and variables → Actions → Variables).
# Voir docs/DEPLOIEMENT.md pour les secrets attendus.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    # Ajouter des « required reviewers » sur cet environnement pour exiger une validation manuelle.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Configurer SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$SHA' '$DEPLOY_PATH'" < scripts/deploy.sh

      - name: Smoke test public
        if: vars.PRODUCTION_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.PRODUCTION_URL }}/healthz"
