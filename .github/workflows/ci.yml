name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      SKIP_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run audit

  pentest:
    # Black-box checks against a real instance (PayPal mocked, throwaway DB).
    runs-on: ubuntu-latest
    needs: test
    env:
      SKIP_DOTENV: '1'
      NODE_ENV: development
      PAYPAL_MODE: mock
      DATABASE_PATH: ${{ runner.temp }}/ci.db
      UPLOAD_DIR: ${{ runner.temp }}/uploads
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run seed
      - name: Démarrer l'application
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run pentest
      - if: failure()
        run: cat server.log

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
